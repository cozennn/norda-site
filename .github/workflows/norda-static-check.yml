name: NorDa static checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, publish/norda-reference-site-clean]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: node --check script.js

      - name: Validate static pages, metadata, structured data and local assets
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit
          import json
          import re
          import sys
          import xml.etree.ElementTree as ET

          errors = []
          pages = [
              Path("index.html"), Path("about.html"), Path("portfolio.html"),
              Path("pricing.html"), Path("faq.html"), Path("policies.html"),
              Path("contact.html"),
          ]

          class Audit(HTMLParser):
              def __init__(self, page):
                  super().__init__(convert_charrefs=True)
                  self.page = page
                  self.ids = set()
                  self.title_open = False
                  self.has_title = False
                  self.canonicals = 0
                  self.refs = []
                  self.jsonld = []
                  self.in_jsonld = False
                  self.jsonld_text = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  item_id = attrs.get("id")
                  if item_id:
                      if item_id in self.ids:
                          errors.append(f"{self.page}: duplicate id #{item_id}")
                      self.ids.add(item_id)
                  if tag == "title":
                      self.title_open = True
                  if tag == "link" and attrs.get("rel", "").lower() == "canonical":
                      self.canonicals += 1
                  for key in ("href", "src"):
                      value = attrs.get(key)
                      if value:
                          self.refs.append(value)
                  if tag == "script" and attrs.get("type") == "application/ld+json":
                      self.in_jsonld = True
                      self.jsonld_text = []

              def handle_endtag(self, tag):
                  if tag == "title":
                      self.title_open = False
                  if tag == "script" and self.in_jsonld:
                      self.jsonld.append("".join(self.jsonld_text))
                      self.in_jsonld = False

              def handle_data(self, data):
                  if self.title_open and data.strip():
                      self.has_title = True
                  if self.in_jsonld:
                      self.jsonld_text.append(data)

          for page in pages:
              if not page.is_file():
                  errors.append(f"Missing page: {page}")
                  continue
              source = page.read_text(encoding="utf-8")
              audit = Audit(page)
              audit.feed(source)
              if not audit.has_title:
                  errors.append(f"{page}: missing title")
              if audit.canonicals != 1:
                  errors.append(f"{page}: expected exactly one canonical URL, found {audit.canonicals}")
              for block in audit.jsonld:
                  try:
                      json.loads(block)
                  except Exception as exc:
                      errors.append(f"{page}: invalid JSON-LD: {exc}")
              for ref in audit.refs:
                  parsed = urlsplit(ref)
                  if parsed.scheme or parsed.netloc or not parsed.path:
                      continue
                  path = parsed.path
                  if path.startswith("/"):
                      path = path.lstrip("/")
                  if path in ("", "."):
                      path = "index.html"
                  # Clean URLs and the existing /packages redirect are handled separately.
                  if not Path(path).suffix or path == "packages":
                      continue
                  if not Path(path).is_file():
                      errors.append(f"{page}: local reference {ref} does not resolve to {path}")

          sitemap = Path("sitemap.xml")
          if sitemap.is_file():
              try:
                  ET.parse(sitemap)
              except Exception as exc:
                  errors.append(f"sitemap.xml: invalid XML: {exc}")
          else:
              errors.append("Missing sitemap.xml")

          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(f"Passed static checks for {len(pages)} pages, JSON-LD, local file references, sitemap XML and JavaScript syntax.")
          PY

      - name: Ensure production routing and backend configuration were not changed
        run: git diff --exit-code origin/main...HEAD -- wrangler.toml _redirects robots.txt
