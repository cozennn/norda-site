<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مراحل العمل (بدون نص)</title>
<style>
:root{--acc:#6FD3FF;--amb:#f5b942;--grn:#7ddf9a;--bg:#0c0c0c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#050505;display:grid;place-items:center}
.stage{position:relative;overflow:hidden;cursor:pointer;width:min(96vw,580px,calc(96vh*580/390));aspect-ratio:580/390;border-radius:14px;background:radial-gradient(60% 75% at 50% 50%,#161a1d,var(--bg))}
.stage svg{position:absolute;inset:0;width:100%;height:100%;transition:opacity .6s}
.stage.fade svg{opacity:0}
.sc{opacity:0;transition:opacity .5s}.sc.show{opacity:1}
.dr{stroke-dasharray:1;stroke-dashoffset:1}
.on .dr{animation:draw .9s ease var(--d,0s) forwards}
.pop{opacity:0;transform:scale(0);transform-box:fill-box;transform-origin:center}
.on .pop{animation:pop .6s cubic-bezier(.3,1.7,.5,1) var(--d,0s) forwards}
.fi{opacity:0}.on .fi{animation:fi .5s ease var(--d,0s) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{opacity:1;transform:scale(1)}}
@keyframes fi{to{opacity:1}}
/* persons */
.pp{opacity:0;transform:translateY(30px)}
.go .pp{animation:rise .8s ease forwards}
.go .pb{animation-delay:.15s}
@keyframes rise{to{opacity:1;transform:none}}
/* progress */
.nd{color:#5a5f63}
.nd .bg{fill:#151719;stroke:#2b2e30;stroke-width:3;transition:all .5s}
.nd .ni{transform-box:fill-box;transform-origin:center;transition:transform .5s}
.nd .bd{opacity:0;transition:opacity .4s}
.nd.dn{color:var(--acc)}.nd.dn .bg{stroke:var(--acc)}.nd.dn .bd{opacity:1}
.nd.cur{color:#0c0c0c}.nd.cur .bg{fill:var(--acc);stroke:var(--acc)}.nd.cur .ni{transform:scale(1.18)}
#line{transition:stroke-dashoffset .9s cubic-bezier(.6,.1,.2,1)}
/* scene 1 */
.on .ring{animation:ring 1.3s ease-out var(--d,0s) both}
.ring{transform-box:fill-box;transform-origin:center;opacity:0}
@keyframes ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2.2)}}
/* scene 2 + 5 flights */
.coin,.box{opacity:0}
.on .coin{animation:fly 1.3s linear .5s forwards}
.on .box{animation:flyL 1.4s linear .5s forwards}
@keyframes fly{0%{opacity:0;transform:translate(0,0);animation-timing-function:ease-out}12%{opacity:1}50%{transform:translate(85px,-85px);animation-timing-function:ease-in}88%{opacity:1}100%{opacity:0;transform:translate(170px,0)}}
@keyframes flyL{0%{opacity:0;transform:translate(0,0);animation-timing-function:ease-out}12%{opacity:1}50%{opacity:1;transform:translate(-93px,-85px);animation-timing-function:ease-in}100%{opacity:1;transform:translate(-186px,-6px)}}
.on .p25{animation:p25 1s ease 2.2s forwards}
.p25{stroke-dasharray:0 100}
@keyframes p25{to{stroke-dasharray:25 100}}
.on .p100{animation:p100 1.2s ease 1.9s forwards}
@keyframes p100{to{stroke-dasharray:100 100}}
/* scene 3 */
.on .eye{animation:blink 2s ease-in-out 1s infinite}
.eye{transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,42%,58%,100%{transform:scaleY(1)}50%{transform:scaleY(.1)}}
.on .gaze{animation:march 1s linear infinite}
@keyframes march{to{stroke-dashoffset:-20}}
/* scene 4 */
.on .cyc{animation:cyc 2.4s linear infinite}
@keyframes cyc{0%,100%{fill:#6FD3FF}33%{fill:#f5b942}66%{fill:#7ddf9a}}
.on .spin{animation:spin 2s linear infinite}
.spin{transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(-360deg)}}
.on .pen{animation:pen 1.6s ease-in-out infinite}
@keyframes pen{50%{transform:translate(26px,8px)}}
/* confetti */
.cf{opacity:0}
.on .cf{animation:fall 2.2s linear var(--d) forwards}
@keyframes fall{0%{opacity:0;transform:translateY(0) rotate(0)}10%{opacity:1}100%{opacity:0;transform:translateY(240px) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="stage" id="stage" role="img" aria-label="رسم متحرك بلا نص: مصافحة اتفاق، ثم دفع جزء من المبلغ، ثم معاينة الشاشة، ثم تعديلات، ثم تسليم هدية ونجاح">
<svg id="svg" viewBox="0 0 580 390" aria-hidden="true">
<defs>
 <linearGradient id="ag" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6FD3FF" stop-opacity=".35"/><stop offset="1" stop-color="#1b2b36"/></linearGradient>
 <g id="per"><circle cx="0" cy="-64" r="16"/><path d="M-28 0V-22a28 26 0 0 1 56 0V0z"/><circle cx="-6" cy="-66" r="1.8" fill="#0c0c0c"/><circle cx="6" cy="-66" r="1.8" fill="#0c0c0c"/><path d="M-6 -58q6 5 12 0" fill="none" stroke="#0c0c0c" stroke-width="2" stroke-linecap="round"/></g>
 <g id="ic1"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 14l2 2 4-4"/></g>
 <g id="ic2"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 10.5h4a1.5 1.5 0 0 1 0 3h-3a1.5 1.5 0 0 0 0 3h4"/></g>
 <g id="ic3"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></g>
 <g id="ic4"><path d="M3 21l3.5-.8L19 7.7a2.1 2.1 0 0 0-3-3L3.8 17.3z"/><path d="M14.5 6.5l3 3"/></g>
 <g id="ic5"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></g>
 <g id="scr"><rect x="-95" y="-70" width="190" height="130" rx="10" fill="#151719" stroke="#5a5f63" stroke-width="3"/><rect x="-8" y="60" width="16" height="14" fill="#5a5f63"/><rect x="-30" y="72" width="60" height="6" rx="3" fill="#5a5f63"/><rect x="-83" y="-58" width="166" height="10" rx="3" fill="#2b2e30"/></g>
</defs>

<line x1="50" y1="312" x2="530" y2="312" stroke="#1d2124" stroke-width="3" stroke-linecap="round"/>

<!-- progress -->
<path d="M500 40H80" stroke="#2b2e30" stroke-width="5" stroke-linecap="round"/>
<path id="line" d="M500 40H80" pathLength="1" stroke="#6FD3FF" stroke-width="5" stroke-linecap="round" fill="none" stroke-dasharray="1" stroke-dashoffset="1"/>
<g fill="none" stroke="#5a5f63" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M451 33l-8 7 8 7"/><path d="M346 33l-8 7 8 7"/><path d="M241 33l-8 7 8 7"/><path d="M136 33l-8 7 8 7"/></g>
<g id="nds" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
 <g class="nd" transform="translate(500 40)"><g class="ni"><circle class="bg" r="24"/><use href="#ic1" transform="translate(-13 -13) scale(1.08)"/></g><g class="bd"><circle cx="-18" cy="-18" r="8" fill="#f5b942" stroke="none"/><path d="M-22 -18l3 3 5-6" stroke="#0c0c0c" stroke-width="2"/></g></g>
 <g class="nd" transform="translate(395 40)"><g class="ni"><circle class="bg" r="24"/><use href="#ic2" transform="translate(-13 -13) scale(1.08)"/></g><g class="bd"><circle cx="-18" cy="-18" r="8" fill="#f5b942" stroke="none"/><path d="M-22 -18l3 3 5-6" stroke="#0c0c0c" stroke-width="2"/></g></g>
 <g class="nd" transform="translate(290 40)"><g class="ni"><circle class="bg" r="24"/><use href="#ic3" transform="translate(-13 -13) scale(1.08)"/></g><g class="bd"><circle cx="-18" cy="-18" r="8" fill="#f5b942" stroke="none"/><path d="M-22 -18l3 3 5-6" stroke="#0c0c0c" stroke-width="2"/></g></g>
 <g class="nd" transform="translate(185 40)"><g class="ni"><circle class="bg" r="24"/><use href="#ic4" transform="translate(-13 -13) scale(1.08)"/></g><g class="bd"><circle cx="-18" cy="-18" r="8" fill="#f5b942" stroke="none"/><path d="M-22 -18l3 3 5-6" stroke="#0c0c0c" stroke-width="2"/></g></g>
 <g class="nd" transform="translate(80 40)"><g class="ni"><circle class="bg" r="24"/><use href="#ic5" transform="translate(-13 -13) scale(1.08)"/></g><g class="bd"><circle cx="-18" cy="-18" r="8" fill="#f5b942" stroke="none"/><path d="M-22 -18l3 3 5-6" stroke="#0c0c0c" stroke-width="2"/></g></g>
</g>

<!-- persons -->
<g transform="translate(150 310)"><g class="pp pa" style="color:#6FD3FF"><use href="#per" style="fill:currentColor"/></g></g>
<g transform="translate(430 310)"><g class="pp pb" style="color:#f5b942"><use href="#per" style="fill:currentColor"/></g></g>

<!-- 1 اتفاق -->
<g id="sc1" class="sc">
 <path class="dr" pathLength="1" d="M176 290L272 262" stroke="#6FD3FF" stroke-width="15" stroke-linecap="round" fill="none" style="--d:.2s"/>
 <path class="dr" pathLength="1" d="M404 290L308 262" stroke="#f5b942" stroke-width="15" stroke-linecap="round" fill="none" style="--d:.2s"/>
 <circle class="pop" cx="290" cy="259" r="14" fill="#f2f2f2" style="--d:1s"/>
 <circle class="ring" cx="290" cy="150" r="36" fill="none" stroke="#6FD3FF" stroke-width="2" style="--d:1.9s"/>
 <g class="pop" style="--d:1.4s"><circle cx="290" cy="150" r="36" fill="#6FD3FF"/><path class="dr" pathLength="1" d="M273 151l12 12 24-26" fill="none" stroke="#0c0c0c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" style="--d:1.8s"/></g>
</g>

<!-- 2 عربون -->
<g id="sc2" class="sc">
 <g transform="translate(190 285)"><g class="coin"><circle r="14" fill="#f5b942"/><circle r="9" fill="none" stroke="#b8872a" stroke-width="2"/><path d="M0 -5v10" stroke="#b8872a" stroke-width="2" stroke-linecap="round"/></g></g>
 <g transform="translate(290 120)"><g class="pop" style="--d:1.8s"><circle r="40" fill="#151719" stroke="#2b2e30" stroke-width="3"/><circle class="p25" r="20" pathLength="100" fill="none" stroke="#6FD3FF" stroke-width="40" transform="rotate(-90)"/><circle r="40" fill="none" stroke="#2b2e30" stroke-width="3"/></g></g>
</g>

<!-- 3 معاينة -->
<g id="sc3" class="sc">
 <g transform="translate(290 215)"><use href="#scr"/>
  <rect class="fi" x="-83" y="-38" width="70" height="14" rx="3" fill="#f2f2f2" style="--d:.5s"/>
  <rect class="fi" x="-83" y="-18" width="56" height="6" rx="3" fill="#5a5f63" style="--d:.8s"/><rect class="fi" x="-83" y="-8" width="44" height="6" rx="3" fill="#5a5f63" style="--d:.95s"/>
  <rect class="fi" x="-83" y="8" width="30" height="12" rx="6" fill="#6FD3FF" style="--d:1.2s"/>
  <g class="fi" style="--d:1s"><rect x="-4" y="-38" width="87" height="64" rx="6" fill="url(#ag)"/><circle cx="60" cy="-20" r="8" fill="#fff"/><path d="M-2 26L24 -2L44 26z" fill="#6FD3FF"/></g>
 </g>
 <g class="fi" style="--d:.3s"><g class="eye"><use href="#ic3" transform="translate(114 134) scale(2.4)" fill="none" stroke="#6FD3FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g></g>
 <path class="gaze fi" d="M168 186Q182 208 198 214" fill="none" stroke="#6FD3FF" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 7" style="--d:.8s"/>
</g>

<!-- 4 تعديلات -->
<g id="sc4" class="sc">
 <g transform="translate(290 215)"><use href="#scr"/>
  <rect class="cyc" x="-83" y="-38" width="70" height="14" rx="3" fill="#6FD3FF"/>
  <rect x="-83" y="-18" width="56" height="6" rx="3" fill="#5a5f63"/><rect x="-83" y="-8" width="44" height="6" rx="3" fill="#5a5f63"/>
  <rect class="cyc" x="-83" y="8" width="30" height="12" rx="6" fill="#6FD3FF"/>
  <g><rect x="-4" y="-38" width="87" height="64" rx="6" fill="url(#ag)"/><circle cx="60" cy="-20" r="8" fill="#fff"/><path class="cyc" d="M-2 26L24 -2L44 26z" fill="#6FD3FF"/></g>
 </g>
 <g class="pen"><use href="#ic4" transform="translate(252 232) scale(2.6)" fill="#151719" stroke="#f2f2f2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g>
 <g class="pop" style="--d:.2s"><g class="spin"><use href="#ic4" transform="translate(0 0)" style="display:none"/><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5" transform="translate(254 76) scale(3)" fill="none" stroke="#f5b942" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g></g>
 <g class="pop" style="--d:.4s"><rect x="100" y="128" width="90" height="62" rx="16" fill="#1e262b"/><path d="M128 189l-8 17 24-17z" fill="#1e262b"/><use href="#ic4" transform="translate(121 138) scale(2)" fill="none" stroke="#6FD3FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>

<!-- 5 تسليم -->
<g id="sc5" class="sc">
 <g transform="translate(290 120)"><g class="pop"><circle r="40" fill="#151719" stroke="#2b2e30" stroke-width="3"/><circle class="p100" r="20" pathLength="100" fill="none" stroke="#6FD3FF" stroke-width="40" transform="rotate(-90)" style="stroke-dasharray:25 100"/><circle r="40" fill="none" stroke="#2b2e30" stroke-width="3"/></g>
  <path class="dr" pathLength="1" d="M-14 2l9 9 19-20" fill="none" stroke="#0c0c0c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" style="--d:3s"/></g>
 <g transform="translate(400 285)"><g class="box"><rect x="-16" y="-14" width="32" height="28" rx="4" fill="#f5b942"/><rect x="-3" y="-14" width="6" height="28" fill="#f2f2f2"/><rect x="-16" y="-3" width="32" height="6" fill="#f2f2f2"/><path d="M0 -14c-8-10-14 0-5 0zM0 -14c8-10 14 0 5 0z" fill="#f2f2f2"/></g></g>
 <g>
  <rect class="cf" x="70" y="85" width="9" height="5" fill="#6FD3FF" style="--d:1.6s"/><rect class="cf" x="125" y="85" width="9" height="5" fill="#f5b942" style="--d:2.0s"/><rect class="cf" x="195" y="85" width="9" height="5" fill="#7ddf9a" style="--d:1.8s"/><rect class="cf" x="245" y="85" width="9" height="5" fill="#f2f2f2" style="--d:2.3s"/><rect class="cf" x="335" y="85" width="9" height="5" fill="#6FD3FF" style="--d:2.1s"/><rect class="cf" x="385" y="85" width="9" height="5" fill="#f5b942" style="--d:1.7s"/><rect class="cf" x="445" y="85" width="9" height="5" fill="#7ddf9a" style="--d:2.4s"/><rect class="cf" x="500" y="85" width="9" height="5" fill="#f2f2f2" style="--d:1.9s"/><rect class="cf" x="290" y="85" width="9" height="5" fill="#f5b942" style="--d:2.6s"/><rect class="cf" x="160" y="85" width="9" height="5" fill="#6FD3FF" style="--d:2.7s"/>
 </g>
</g>
</svg>
</div>
<script>
(function(){
 var st=document.getElementById('stage'),svg=document.getElementById('svg'),line=document.getElementById('line'),
 scs=[1,2,3,4,5].map(function(i){return document.getElementById('sc'+i)}),
 nds=[].slice.call(document.querySelectorAll('.nd')),T=[],cur=-1;
 function at(ms,f){T.push(setTimeout(f,ms))}
 function go(k){
  var prev=cur;cur=k;
  scs.forEach(function(s,i){
   if(i===k){s.classList.add('on','show')}
   else{s.classList.remove('show');if(i===prev)(function(s){at(700,function(){s.classList.remove('on')})})(s)}
  });
  nds.forEach(function(n,i){n.classList.toggle('cur',i===k);n.classList.toggle('dn',i<k)});
  line.style.strokeDashoffset=1-k/4;
 }
 function play(){
  T.forEach(clearTimeout);T=[];cur=-1;
  st.classList.remove('fade');svg.classList.remove('go');
  scs.forEach(function(s){s.classList.remove('on','show')});
  nds.forEach(function(n){n.classList.remove('cur','dn')});
  line.style.strokeDashoffset=1;
  void svg.getBoundingClientRect();
  at(200,function(){svg.classList.add('go')});
  [900,4300,7700,11100,14500].forEach(function(t,k){at(t,function(){go(k)})});
  at(19000,function(){st.classList.add('fade')});
  at(19700,play);
 }
 st.addEventListener('click',play);
 play();
})();
</script>
</body>
</html>
